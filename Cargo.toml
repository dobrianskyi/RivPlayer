[package]
name = "rivplayer"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Native Linux media player with built-in decoders"
repository = "https://github.com/dobrianskyi/RivPlayer"

[features]
default = ["vaapi"]
vaapi = ["dep:oxideav-vaapi"]
av1-simd = ["rav1d/asm"]

[dependencies]
anyhow = "1"
cpal = "0.17.3"
crossbeam-channel = "0.5"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
libc = "0.2"
libbitsub-core = "1.13.2"
opus-decoder = "0.1.1"
oxideav-ac3 = "0.0.12"
# Contains the upstream fix for DTS Core gain and scale-factor codebooks.
oxideav-dts = { git = "https://github.com/OxideAV/oxideav-dts.git", rev = "08ba76f53a02f054a656024a8a3e7b9c7cf498f7" }
oxideav-avi = "0.0.11"
oxideav-flv = "0.0.6"
oxideav-mpegts = "0.0.4"
oxideav-mpeg12video = "0.0.14"
oxideav-mpeg4video = "0.1.10"
oxideav-ogg = "0.1.9"
oxideav-theora = "0.0.12"
rusqlite = { version = "0.43", features = ["bundled"] }
oxideav-core = "0.1.43"
oxideav-flac = "0.0.13"
oxideav-h264 = "0.1.12"
oxideav-h265 = "0.0.18"
oxideav-mkv = "0.0.12"
oxideav-mov = "0.0.7"
oxideav-mp3 = "0.1.3"
oxideav-mp4 = "0.0.11"
oxideav-vp8 = "0.2.9"
oxideav-vp9 = "0.0.15"
oxideav-vaapi = { git = "https://github.com/ropoctl/oxideav-vaapi.git", rev = "349446c858e66707c44749af9da8197bd6a5e59f", features = ["h264", "hevc", "vp9", "av1"], optional = true }
percent-encoding = "2.3"
rav1d = { version = "1.1.0", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
rfd = "0.17"
rusty-opus = "1.1.1"
symphonia = { version = "0.6.1", default-features = false, features = ["aac", "alac", "flac", "mp2", "mp3", "opt-simd", "pcm", "vorbis"] }
veloce-mpegts = "0.1.7"
wsola = "0.3"
winit = { version = "0.30", default-features = false, features = ["x11"] }
x11rb = "0.13"
zbus = { version = "6.2.1", default-features = false, features = ["default-rt", "service"] }
async-channel = "2"

[patch.crates-io]
# Backports positioned Wayland file drops to the Winit 0.30 API used by eframe.
winit = { git = "https://github.com/storytold/winit.git", rev = "2732964c88457e3e4b796ac6b15ef7fb332a6aad" }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 8
strip = "debuginfo"
